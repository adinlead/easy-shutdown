[package]
name = "easy-shutdown"
version = "0.1.0"
edition = "2021"
description = "EasyShutdown core layer (system operator / countdown / audio / config)"

[dependencies]
# MP3 解码与播放（对应 Java 版 jlayer）
rodio = { version = "0.19", features = ["mp3"] }

# Win32 API（对应 Java 版 JNA）：ExitWindowsEx / 令牌提权
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
] }
