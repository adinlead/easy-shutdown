[package]
name = "easy-shutdown"
version = "0.1.0"
edition = "2021"
description = "EasyShutdown core layer (system operator / countdown / audio / config)"

[dependencies]
# MP3 解码与播放（对应 Java 版 jlayer）
rodio = { version = "0.19", features = ["mp3"] }

# GUI：eframe（egui 应用框架）
eframe = "0.29"
egui = "0.29"

# 系统托盘
tray-icon = "0.13"
# tray-icon 0.13 内部使用 crossbeam-channel 传递事件，此处显式依赖以便持有 Receiver
crossbeam-channel = "0.5"

# 图标解码（托盘用 PNG）
image = { version = "0.25", default-features = false, features = ["png"] }

# 文件选择对话框（设置里选音频）
rfd = "0.15"

# 取 eframe 创建上下文里的原生窗口句柄（托盘菜单线程需要直接投递 WM_CLOSE）
raw-window-handle = "0.6"

# Win32 API（对应 Java 版 JNA）：ExitWindowsEx / 令牌提权
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
